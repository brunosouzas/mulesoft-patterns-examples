http:
  host: "0.0.0.0"
  port: "8081"

# OCP: payment method -> implementation flow. Adding a method is a new entry plus a new flow.
payment:
  flow:
    creditCard: "ocp-after-process-credit-card"
    bankSlip: "ocp-after-process-bank-slip"
    pix: "ocp-after-process-pix"

# DIP: which implementation of the "order repository" abstraction the app uses.
orders:
  repository: "dip-after-order-repository-in-memory"

# EIP: Enterprise Integration Patterns (src/main/mule/eip/).
eip:
  # Host the EIP examples use to call this same application over HTTP (batch client, payment provider
  # simulator and its callback, Mule correlation ID demo). The port is http.port.
  selfCall:
    host: "localhost"
  # Correlation identifier: where the simulated payment provider sends its asynchronous callback.
  provider:
    callbackPath: "/eip/payments/callback"
  # Orders of the routing examples: shipping to another country is international (content-based router,
  # recipient list).
  orders:
    homeCountry: "BR"
  # Content-based router: orders at or above the threshold go to manual review; orders shipped outside
  # the home country go to international fulfilment; the rest to domestic fulfilment.
  router:
    reviewThreshold: "1000"
  # Aggregator: how long an order's items may take to arrive before the group times out (short, so the
  # demo and the tests can show it), and how long a finished group is remembered to reject late items.
  invoice:
    groupTimeoutSeconds: "5"
    groupEvictionMinutes: "60"
  # Recipient list: where each downstream system is reached (paths on this app, simulated systems).
  recipientList:
    paths:
      invoicing: "/eip/recipients/invoicing/orders"
      warehouse: "/eip/recipients/warehouse/orders"
      digitalDelivery: "/eip/recipients/digitalDelivery/orders"
      customs: "/eip/recipients/customs/orders"
  # Scatter-gather: the longest the order checks may take together before the routes still running fail.
  scatterGather:
    timeoutMillis: "10000"
  # Claim check: how long a checked-in order document can be claimed before the store drops it (short, so
  # the demo and the tests can show a claim expiring), and how often the store looks for expired entries.
  claimCheck:
    ttlSeconds: "3"
    expirationIntervalSeconds: "1"
  # Request-reply: how long the simulated warehouse takes to make a reservation (so waiting shows in the
  # timings), and the requestor's fixed reply channel for asynchronous replies.
  requestReply:
    warehouseDelayMillis: "300"
    replyChannelPath: "/eip/stock/reservation-replies"
  # Polling consumer: how often the Scheduler polls the pending orders.
  pollingConsumer:
    frequencyMillis: "1000"
  # Competing consumers: how many consumers run at once (also the consumer flow's maxConcurrency), and how
  # long issuing one invoice takes, so the consumers overlap.
  competingConsumers:
    consumers: "3"
    workMillis: "50"
  # Guaranteed delivery: how often the forwarder sends the orders still in the persistent outbox, and after
  # how many failed attempts an order is moved to the dead (quarantine) store instead of being sent again.
  guaranteedDelivery:
    forwardFrequencyMillis: "1000"
    maxAttempts: "5"
  # Message expiration: how often the consumer reads the queued stock reservation requests.
  messageExpiration:
    consumerFrequencyMillis: "1000"
  # Process manager: payments above this amount are declined by the simulated payment service, and the
  # manager's reply endpoint, where the simulated services post their asynchronous replies.
  processManager:
    paymentLimit: "1000"
    replyPath: "/eip/process-manager/replies"
